181818;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="63.368" y1="238.635" x2="369.322" y2="238.635" style="stroke:#181818;stroke-width:1.563;"/><text x="74.306" y="230.72" fill="#000" font-size="20.313" textLength="178.31" font-family="DejaVu Sans">choose report file</text><line x1="378.697" y1="307.8" x2="444.322" y2="307.8" style="stroke:#181818;stroke-width:1.563;"/><line x1="444.322" y1="307.8" x2="444.322" y2="328.113" style="stroke:#181818;stroke-width:1.563;"/><line x1="380.26" y1="328.113" x2="444.322" y2="328.113" style="stroke:#181818;stroke-width:1.563;"/><polygon points="395.885,321.863,380.26,328.113,395.885,334.363,389.635,328.113" fill="#181818" style="stroke:#181818;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="389.635" y="276.24" fill="#000" font-size="20.313" textLength="255.047" font-family="DejaVu Sans">1. sign file with student's</text><text x="389.635" y="299.885" fill="#000" font-size="20.313" textLength="417.636" font-family="DejaVu Sans">signing PRIVATE key (RSA-PSS, SHA-256)</text><line x1="378.697" y1="373.633" x2="444.322" y2="373.633" style="stroke:#181818;stroke-width:1.563;"/><line x1="444.322" y1="373.633" x2="444.322" y2="393.945" style="stroke:#181818;stroke-width:1.563;"/><line x1="380.26" y1="393.945" x2="444.322" y2="393.945" style="stroke:#181818;stroke-width:1.563;"/><polygon points="395.885,387.695,380.26,393.945,395.885,400.195,389.635,393.945" fill="#181818" style="stroke:#181818;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="389.635" y="365.717" fill="#000" font-size="20.313" textLength="496.139" font-family="DejaVu Sans">2. package = signature length + signature + file</text><line x1="378.697" y1="463.11" x2="444.322" y2="463.11" style="stroke:#181818;stroke-width:1.563;"/><line x1="444.322" y1="463.11" x2="444.322" y2="483.423" style="stroke:#181818;stroke-width:1.563;"/><line x1="380.26" y1="483.423" x2="444.322" y2="483.423" style="stroke:#181818;stroke-width:1.563;"/><polygon points="395.885,477.173,380.26,483.423,395.885,489.673,389.635,483.423" fill="#181818" style="stroke:#181818;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="389.635" y="431.55" fill="#000" font-size="20.313" textLength="479.774" font-family="DejaVu Sans">3. make random 8-byte DES key and 8-byte IV,</text><text x="389.635" y="455.195" fill="#000" font-size="20.313" textLength="468.14" font-family="DejaVu Sans">encrypt package (DES-CBC, PKCS#7 padding)</text><line x1="378.697" y1="552.588" x2="444.322" y2="552.588" style="stroke:#181818;stroke-width:1.563;"/><line x1="444.322" y1="552.588" x2="444.322" y2="572.9" style="stroke:#181818;stroke-width:1.563;"/><line x1="380.26" y1="572.9" x2="444.322" y2="572.9" style="stroke:#181818;stroke-width:1.563;"/><polygon points="395.885,566.65,380.26,572.9,395.885,579.15,389.635,572.9" fill="#181818" style="stroke:#181818;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="389.635" y="521.027" fill="#000" font-size="20.313" textLength="363.017" font-family="DejaVu Sans">4. encrypt DES key with evaluator's</text><text x="389.635" y="544.672" fill="#000" font-size="20.313" textLength="355.955" font-family="DejaVu Sans">encryption PUBLIC key (RSA-OAEP)</text><polygon points="877.961,635.815,893.586,642.065,877.961,648.315,884.211,642.065" fill="#181818" style="stroke:#181818;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="378.697" y1="642.065" x2="887.336" y2="642.065" style="stroke:#181818;stroke-width:1.563;"/><text x="389.635" y="610.505" fill="#000" font-size="20.313" textLength="436.669" font-family="DejaVu Sans">5. upload ciphertext, IV, wrapped DES key,</text><text x="389.635" y="634.15" fill="#000" font-size="20.313" textLength="349.934" font-family="DejaVu Sans">IDs of the two public keys (HTTPS)</text><line x1="896.711" y1="711.23" x2="962.336" y2="711.23" style="stroke:#181818;stroke-width:1.563;"/><line x1="962.336" y1="711.23" x2="962.336" y2="731.543" style="stroke:#181818;stroke-width:1.563;"/><line x1="898.273" y1="731.543" x2="962.336" y2="731.543" style="stroke:#181818;stroke-width:1.563;"/><polygon points="913.898,725.293,898.273,731.543,913.898,737.793,907.648,731.543" fill="#181818" style="stroke:#181818;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="907.648" y="679.67" fill="#000" font-size="20.313" textLength="355.826" font-family="DejaVu Sans">check sender is in the relationship,</text><text x="907.648" y="703.315" fill="#000" font-size="20.313" textLength="462.457" font-family="DejaVu Sans">keys belong to the right users, sizes are valid</text><polygon points="1512.98,770.813,1528.605,777.063,1512.98,783.313,1519.23,777.063" fill="#181818" style="stroke:#181818;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="896.711" y1="777.063" x2="1522.355" y2="777.063" style="stroke:#181818;stroke-width:1.563;"/><text x="907.648" y="769.147" fill="#000" font-size="20.313" textLength="392.027" font-family="DejaVu Sans">save ciphertext under a random name</text><polygon points="1362.292,816.333,1377.917,822.583,1362.292,828.833,1368.542,822.583" fill="#181818" style="stroke:#181818;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="896.711" y1="822.583" x2="1371.667" y2="822.583" style="stroke:#181818;stroke-width:1.563;"/><text x="907.648" y="814.668" fill="#000" font-size="20.313" textLength="266.651" font-family="DejaVu Sans">insert row into documents</text><polygon points="395.885,861.853,380.26,868.103,395.885,874.353,389.635,868.103" fill="#181818" style="stroke:#181818;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="386.51" y1="868.103" x2="895.148" y2="868.103" style="stroke:#181818;stroke-width:1.563;stroke-dasharray:3.125,3.125;"/><text x="405.26" y="860.188" fill="#000" font-size="20.313" textLength="126.06" font-family="DejaVu Sans">201 Created</text><po